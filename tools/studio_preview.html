<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电脑预览 · ESP Mini App</title><link rel="stylesheet" href="/studio.css"></head>
<body><header><a class="brand" href="/">ESP Mini App · 本地开发者工作台</a><p>用浏览器模拟应用画布和部分输入</p><nav aria-label="主导航"><a href="/">我的项目</a><a href="/examples">示例应用</a><a href="/docs">开发文档</a><a href="/review">投稿包初审</a></nav></header>
<main><div class="page-heading"><h1 id="pageTitle">电脑交互预览</h1><p>运行刚构建的 WASM。浏览器环境与设备 WAMR 不完全一致；投稿前仍需真机检查。</p></div><div class="actions"><a class="button light" id="editLink" href="/">← 返回项目开发</a><a class="button light" id="detailLink" href="/app">查看应用详情</a></div>
<section><div class="preview"><canvas id="screen" width="480" height="400" aria-label="应用画布"></canvas><div class="controls"><div class="actions"><button id="preview">启动 / 重启预览</button><button id="stop" class="light">停止</button></div><h3>模拟输入</h3><button class="light" data-event="1">人体感应</button><button class="light" data-event="2">按键 A</button><button class="light" data-event="3">按键 B</button><label for="weather">天气代码（WMO）</label><input id="weather" type="number" value="0"><label for="temperature">温度（°C）</label><input id="temperature" type="number" value="25"><h3>传感器与反馈</h3><label for="imuAx">加速度 X（g）</label><input id="imuAx" type="number" step="0.1" value="0"><label for="imuAy">加速度 Y（g）</label><input id="imuAy" type="number" step="0.1" value="0"><label for="imuAz">加速度 Z（g）</label><input id="imuAz" type="number" step="0.1" value="1"><label for="magnetX">磁场 X（μT）</label><input id="magnetX" type="number" step="1" value="25"><label for="magnetY">磁场 Y（μT）</label><input id="magnetY" type="number" step="1" value="0"><label for="magnetZ">磁场 Z（μT）</label><input id="magnetZ" type="number" step="1" value="40"><label for="batteryPercent">电量（%）</label><input id="batteryPercent" type="number" min="0" max="100" value="75"><p id="feedbackState" class="subtle">震动与 LED：未触发</p><label for="hardwareMask">模拟外设</label><select id="hardwareMask"><option value="65535">全部可用（模拟）</option><option value="4095">旧版外设</option><option value="3">仅屏幕和触摸</option><option value="1">仅屏幕</option></select><p class="subtle">缺少 Manifest 声明的必需外设时，预览无法运行。</p><p id="previewStatus" class="status" role="status">等待构建</p></div></div></section></main>
<script src="/studio.js"></script><script src="/preview.js"></script></body></html>
