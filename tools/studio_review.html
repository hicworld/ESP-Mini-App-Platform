<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投稿包初审 · ESP Mini App</title><link rel="stylesheet" href="/studio.css"></head>
<body><header><a class="brand" href="/">ESP Mini App · 本地开发者工作台</a><p>投稿包自动初审</p><nav aria-label="主导航"><a href="/">我的项目</a><a href="/examples">示例应用</a><a href="/docs">开发文档</a><a href="/review" aria-current="page">投稿包初审</a></nav></header>
<main><div class="page-heading"><h1>投稿包自动初审</h1><p>选择工作台导出的投稿 ZIP，检查归档、Manifest、WASM、校验和及接口声明。报告只给出“拒收”或“进入人工复核”。</p></div>
<div class="stack"><section><h2>选择投稿包</h2><label for="package">投稿 ZIP</label><input id="package" type="file" accept=".zip,application/zip"><div class="actions"><button id="check">开始初审</button><button id="download" class="light" disabled>下载 JSON 报告</button></div><p id="status" class="status" role="status"></p></section>
<section id="result" hidden><h2 id="verdict">检查结果</h2><dl class="meta"><div><dt>文件</dt><dd id="fileName"></dd></div><div><dt>ZIP SHA256</dt><dd id="fileHash"></dd></div><div><dt>应用</dt><dd id="appInfo"></dd></div><div><dt>检查项</dt><dd id="counts"></dd></div></dl><h3>逐项结果</h3><div id="findings"></div></section>
<section><h2>人工复核仍需完成</h2><p>核对作者与应用 ID 归属、源码和素材授权；从审核后的源码可信重建，对照 WASM，随后进行真机测试。只有人工批准后才可用平台私钥签名并更新在线目录。</p><a href="/docs?id=submission">阅读投稿与发布流程</a></section></div></main>
<script src="/studio.js"></script><script src="/review.js"></script></body></html>
