<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目开发 · ESP Mini App</title><link rel="stylesheet" href="/studio.css"></head>
<body><header><a class="brand" href="/">ESP Mini App · 本地开发者工作台</a><p>编辑 Manifest 和源码，构建无签名 WASM</p><nav aria-label="主导航"><a href="/">我的项目</a><a href="/examples">示例应用</a><a href="/docs">开发文档</a><a href="/review">投稿包初审</a></nav></header>
<main><div class="page-heading"><h1 id="pageTitle">项目开发</h1><p id="projectSummary">正在加载项目…</p></div><div class="actions"><a class="button light" href="/">← 项目列表</a><a class="button light" id="previewLink" href="/preview">电脑交互预览</a><a class="button light" id="detailLink" href="/app">应用详情</a><a class="button light" href="/docs?id=api">平台函数速查</a></div>
<div class="stack"><section><h2>应用配置</h2><div class="grid"><div><label for="appId">应用 ID</label><input id="appId"></div><div><label for="appName">显示名称</label><input id="appName"></div><div><label for="version">版本号</label><input id="version"></div><div><label for="platformMin">最低平台版本</label><input id="platformMin"></div><div><label for="author">作者名（公开显示）</label><input id="author" placeholder="请填写作者名"></div></div><label for="description">应用简介（公开显示）</label><textarea id="description" placeholder="介绍应用用途和主要操作"></textarea><h3>权限</h3><div class="checks" id="permissions"></div><h3>必需外设</h3><div class="checks" id="hardware"></div><h3>可选外设</h3><div class="checks" id="optional_hardware"></div><div class="actions"><button id="save">保存 Manifest</button><button id="build">保存并构建检查</button><button id="export">导出投稿 ZIP</button></div><p id="status" class="status" role="status"></p><pre id="log" class="log" aria-label="构建日志">尚未构建</pre></section>
<section><h2>源码编辑器</h2><p class="subtle">选择已有的文本源码进行编辑；Manifest 请用上方表单。保存源码后重新构建，若文件已被其他编辑器修改会阻止覆盖。</p><div class="editor-layout"><div id="editorFiles" class="editor-files"></div><div><label for="editor">文件：<span id="editorPath">未选择</span></label><textarea id="editor" class="code-editor" spellcheck="false" disabled></textarea><div class="actions"><button id="saveFile" disabled>保存代码</button><span id="editorStatus" class="subtle" role="status"></span></div></div></div></section></div></main>
<script src="/studio.js"></script><script src="/project.js"></script></body></html>
